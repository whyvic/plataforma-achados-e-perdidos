<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Plataforma de Achados e Perdidos</title>
    <link rel="stylesheet" href="css/responsive-global.css">
    <link rel="stylesheet" href="css/home-responsive.css">
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <div class="logo">
                    <img src="assets/brasao1_horizontal_cor_72dpi (1).png" alt="Brasão" />
                </div>
                <div class="nav-menu">
                    <div class="nav-item">
                        <img src="assets/home-icon.svg" alt="Home" class="nav-icon">
                        <span>Visualizar objetos</span>
                    </div>
                    <div class="nav-item">
                        <img src="assets/add-icon.svg" alt="Add" class="nav-icon">
                        <span>Cadastrar objeto</span>
                    </div>
                    <div class="nav-login">
                        <div class="avatar">
                            <img src="assets/logout-icon.svg" alt="Logout" />
                        </div>
                        <span>Logout</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content">

    <!-- Sidebar de Filtros -->
    <div class="sidebar">
        <!-- Barra de Pesquisa -->
        <div class="search-section">
            <h3>Pesquisar Objetos</h3>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Digite para buscar objetos..." class="search-input">
                <button class="search-btn" onclick="performSearch()">
                    <img src="assets/search-icon.svg" alt="Pesquisar" class="search-icon">
                </button>
            </div>
            <button class="clear-search-btn hidden" onclick="clearSearch()" id="clearBtn">Limpar Pesquisa</button>
        </div>

        <!-- Seção Categorias -->
        <div class="filter-section">
            <h3>Categorias</h3>
            <div class="filter-list">
                <div class="filter-item">
                    <input type="checkbox" id="cat-garrafas" name="categoria" value="Garrafas" class="filter-checkbox">
                    <label for="cat-garrafas" class="filter-info">
                        <span>Garrafas</span>
                        <span class="count">(2)</span>
                    </label>
                </div>
                <div class="filter-item">
                    <input type="checkbox" id="cat-cartoes" name="categoria" value="Cartões" class="filter-checkbox">
                    <label for="cat-cartoes" class="filter-info">
                        <span>Cartões</span>
                        <span class="count">(2)</span>
                    </label>
                </div>
                <div class="filter-item">
                    <input type="checkbox" id="cat-chaveiros" name="categoria" value="Chaveiros" class="filter-checkbox">
                    <label for="cat-chaveiros" class="filter-info">
                        <span>Chaveiros</span>
                        <span class="count">(2)</span>
                    </label>
                </div>
                <div class="filter-item">
                    <input type="checkbox" id="cat-eletronicos" name="categoria" value="Eletrônicos" class="filter-checkbox">
                    <label for="cat-eletronicos" class="filter-info">
                        <span>Eletrônicos</span>
                        <span class="count">(3)</span>
                    </label>
                </div>
                <div class="filter-item">
                    <input type="checkbox" id="cat-roupas" name="categoria" value="Roupas e acessórios" class="filter-checkbox">
                    <label for="cat-roupas" class="filter-info">
                        <span>Roupas e acessórios</span>
                        <span class="count">(0)</span>
                    </label>
                </div>
                <div class="filter-item">
                    <input type="checkbox" id="cat-outros" name="categoria" value="Outros" class="filter-checkbox">
                    <label for="cat-outros" class="filter-info">
                        <span>Outros</span>
                        <span class="count">(3)</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Seção Lugares -->
        <div class="filter-section">
            <h3>Lugares</h3>
            <div class="filter-list">
                <div class="filter-item">
                    <input type="checkbox" id="loc-sala" name="lugar" value="Sala de Aula" class="filter-checkbox">
                    <label for="loc-sala" class="filter-info">
                        <span>Sala de Aula</span>
                        <span class="count">(4)</span>
                    </label>
                </div>
                <div class="filter-item">
                    <input type="checkbox" id="loc-laboratorio" name="lugar" value="Laboratório" class="filter-checkbox">
                    <label for="loc-laboratorio" class="filter-info">
                        <span>Laboratório</span>
                        <span class="count">(2)</span>
                    </label>
                </div>
                <div class="filter-item">
                    <input type="checkbox" id="loc-ru" name="lugar" value="RU" class="filter-checkbox">
                    <label for="loc-ru" class="filter-info">
                        <span>RU</span>
                        <span class="count">(0)</span>
                    </label>
                </div>
                <div class="filter-item">
                    <input type="checkbox" id="loc-hall" name="lugar" value="Hall" class="filter-checkbox">
                    <label for="loc-hall" class="filter-info">
                        <span>Hall</span>
                        <span class="count">(0)</span>
                    </label>
                </div>
                <div class="filter-item">
                    <input type="checkbox" id="loc-biblioteca" name="lugar" value="Biblioteca" class="filter-checkbox">
                    <label for="loc-biblioteca" class="filter-info">
                        <span>Biblioteca</span>
                        <span class="count">(2)</span>
                    </label>
                </div>
                <div class="filter-item">
                    <input type="checkbox" id="loc-outros" name="lugar" value="Outros" class="filter-checkbox">
                    <label for="loc-outros" class="filter-info">
                        <span>Outros</span>
                        <span class="count">(0)</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Seção Status -->
        <div class="filter-section">
            <h3>Status</h3>
            <div class="filter-list">
                <div class="filter-item">
                    <input type="checkbox" id="status-encontrado" name="status" value="Encontrado" class="filter-checkbox">
                    <label for="status-encontrado" class="filter-info">
                        <span>Encontrado</span>
                        <span class="count">(39)</span>
                    </label>
                </div>
                <div class="filter-item">
                    <input type="checkbox" id="status-devolvido" name="status" value="Devolvido" class="filter-checkbox">
                    <label for="status-devolvido" class="filter-info">
                        <span>Devolvido</span>
                        <span class="count">(20)</span>
                    </label>
                </div>
                <div class="filter-item">
                    <input type="checkbox" id="status-doacao" name="status" value="Encaminhado para doação" class="filter-checkbox">
                    <label for="status-doacao" class="filter-info">
                        <span>Encaminhado para doação</span>
                        <span class="count">(8)</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Área Principal de Cards -->
    <div class="main-content">
        <!-- Os cards serão carregados dinamicamente aqui -->
        <div id="loading-message" class="loading-message">
            🔍 Carregando objetos perdidos...
        </div>
    </div>
        </div> <!-- Fim content -->
    </div> <!-- Fim main-container -->

    <!-- Scripts -->
    <script src="js/search-filters.js"></script>
</body>
</html>
