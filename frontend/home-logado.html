<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Achados e Perdidos - Home Logado</title>
    <link rel="stylesheet" href="css/responsive-global.css">
    <link rel="stylesheet" href="css/home-responsive.css">
    <link rel="stylesheet" href="css/status-modal.css">
    <link rel="stylesheet" href="css/toast.css">
</head>
<body>
    <div class="main-container">
        <div class="header">
            <div class="header-content">
                <div class="logo">
                    <img src="assets/brasao1_horizontal_cor_72dpi (1).png" alt="Brasão" />
                </div>
                
                <div class="nav-menu">
                    <div class="nav-item" onclick="navigateToHome()">
                        <img src="assets/home-icon.svg" alt="Home" class="nav-icon" />
                        <span>Visualizar objetos</span>
                    </div>
                    
                    <div class="nav-item" onclick="navigateToCadastro()">
                        <img src="assets/add-icon.svg" alt="Add" class="nav-icon" />
                        <span>Cadastrar objeto</span>
                    </div>
                    
                    <div class="logout-btn">
                        <div class="avatar">
                            <img src="assets/logout-icon.svg" alt="Logout" />
                        </div>
                        <span>Logout</span>
                    </div>
                </div>
            </div>
        </div>

        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
        
        <div class="sidebar-overlay" onclick="closeSidebar()"></div>

        <div class="content">

        <div class="sidebar">
            <div class="search-section">
                <h3>Pesquisar Objetos</h3>
                <div class="search-bar">
                    <input type="text" class="search-input" placeholder="Digite para buscar objetos..." id="searchInput">
                    <button class="search-btn">
                        <img src="assets/search-icon.svg" alt="Pesquisar" class="search-icon">
                    </button>
                </div>
                <button class="clear-search-btn hidden" onclick="clearSearch()" id="clearBtn">Limpar Pesquisa</button>
            </div>

            <div class="filter-section">
                <h3>Categorias</h3>
                <div class="filter-options">
                    <div class="filter-item">
                        <input type="checkbox" id="cat-garrafas-logado" name="categoria" value="Garrafas" class="filter-checkbox">
                        <label for="cat-garrafas-logado" class="filter-label">
                            <span class="category-name">Garrafas</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                    
                    <div class="filter-item">
                        <input type="checkbox" id="cat-cartoes-logado" name="categoria" value="Cartões" class="filter-checkbox">
                        <label for="cat-cartoes-logado" class="filter-label">
                            <span class="category-name">Cartões</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                    
                    <div class="filter-item">
                        <input type="checkbox" id="cat-chaveiros-logado" name="categoria" value="Chaveiros" class="filter-checkbox">
                        <label for="cat-chaveiros-logado" class="filter-label">
                            <span class="category-name">Chaveiros</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                    
                    <div class="filter-item">
                        <input type="checkbox" id="cat-eletronicos-logado" name="categoria" value="Eletrônicos" class="filter-checkbox">
                        <label for="cat-eletronicos-logado" class="filter-label">
                            <span class="category-name">Eletrônicos</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                    
                    <div class="filter-item">
                        <input type="checkbox" id="cat-roupas-logado" name="categoria" value="Roupas e acessórios" class="filter-checkbox">
                        <label for="cat-roupas-logado" class="filter-label">
                            <span class="category-name">Roupas e acessórios</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                    
                    <div class="filter-item">
                        <input type="checkbox" id="cat-outros-logado" name="categoria" value="Outros" class="filter-checkbox">
                        <label for="cat-outros-logado" class="filter-label">
                            <span class="category-name">Outros</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="filter-section">
                <h3>Lugares</h3>
                <div class="filter-options">
                    <div class="filter-item">
                        <input type="checkbox" id="loc-sala-logado" name="lugar" value="Sala de Aula" class="filter-checkbox">
                        <label for="loc-sala-logado" class="filter-label">
                            <span class="category-name">Sala de Aula</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                    
                    <div class="filter-item">
                        <input type="checkbox" id="loc-laboratorio-logado" name="lugar" value="Laboratório" class="filter-checkbox">
                        <label for="loc-laboratorio-logado" class="filter-label">
                            <span class="category-name">Laboratório</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                    
                    <div class="filter-item">
                        <input type="checkbox" id="loc-ru-logado" name="lugar" value="RU" class="filter-checkbox">
                        <label for="loc-ru-logado" class="filter-label">
                            <span class="category-name">RU</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                    
                    <div class="filter-item">
                        <input type="checkbox" id="loc-hall-logado" name="lugar" value="Hall" class="filter-checkbox">
                        <label for="loc-hall-logado" class="filter-label">
                            <span class="category-name">Hall</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                    
                    <div class="filter-item">
                        <input type="checkbox" id="loc-biblioteca-logado" name="lugar" value="Biblioteca" class="filter-checkbox">
                        <label for="loc-biblioteca-logado" class="filter-label">
                            <span class="category-name">Biblioteca</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                    
                    <div class="filter-item">
                        <input type="checkbox" id="loc-outros-logado" name="lugar" value="Outros" class="filter-checkbox">
                        <label for="loc-outros-logado" class="filter-label">
                            <span class="category-name">Outros</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="filter-section">
                <h3>Status</h3>
                <div class="filter-options">
                    <div class="filter-item">
                        <input type="checkbox" id="status-encontrado" name="status" value="Encontrado" class="filter-checkbox">
                        <label for="status-encontrado" class="filter-label">
                            <span class="category-name">Encontrado</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                    
                    <div class="filter-item">
                        <input type="checkbox" id="status-devolvido" name="status" value="Devolvido" class="filter-checkbox">
                        <label for="status-devolvido" class="filter-label">
                            <span class="category-name">Devolvido</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                    
                    <div class="filter-item">
                        <input type="checkbox" id="status-doacao" name="status" value="Encaminhado para doação" class="filter-checkbox">
                        <label for="status-doacao" class="filter-label">
                            <span class="category-name">Encaminhado para doação</span>
                            <span class="category-count">(0)</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div id="loading-message" class="loading-message">
                🔍 Carregando objetos perdidos...
            </div>
        </div>
    </div>

    <div class="toast-overlay" id="statusModal" onclick="closeStatusModal()">
        <div class="status-modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span>Objeto perdido</span>
                <button class="close-btn" onclick="closeStatusModal()">×</button>
            </div>
            
            <div class="modal-content">
                <div class="object-image">
                    <img id="modal-item-image" src="" alt="Objeto" />
                </div>
                
                <div class="validation-section">
                    <h3>Validação do objeto</h3>
                    
                    <div class="form-fields">
                        <div class="form-field">
                            <label>Pergunta de validação</label>
                            <input type="text" id="validation-question" class="form-input" />
                        </div>
                        
                        <div class="form-field">
                            <label>Resposta de validação</label>
                            <input type="text" id="validation-answer" class="form-input" />
                        </div>
                        
                        <div class="form-field">
                            <label>Status</label>
                            <select id="status-dropdown" class="status-select">
                                <option value="">Selecione o status</option>
                                <option value="Encontrado">Encontrado</option>
                                <option value="Devolvido">Devolvido</option>
                                <option value="Encaminhado para doação">Encaminhado para doação</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="modal-actions">
                <button class="delete-btn" onclick="deleteItem()">
                    <span>×</span>
                    <span>Excluir</span>
                </button>
                <button class="save-btn" onclick="saveItemChanges()">
                    <span>✓</span>
                    <span>Salvar</span>
                </button>
            </div>
        </div>
    </div>
        </div> </div> <script src="js/search-filters.js"></script>
    
    <script src="js/home-logado.js"></script>
    
    <script>
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if(sidebar) sidebar.classList.toggle('open');
            if(overlay) overlay.classList.toggle('active');
        }
        
        function closeSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if(sidebar) sidebar.classList.remove('open');
            if(overlay) overlay.classList.remove('active');
        }
    </script>
</body>
</html>
